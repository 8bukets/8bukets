<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Intelligence Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .prompt-card { transition: transform 0.2s, box-shadow 0.2s; }
        .prompt-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="max-w-7xl mx-auto p-8">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-indigo-700 mb-3">Prompt Intelligence Framework</h1>
            <p class="text-gray-600 text-lg">Interactive Visualization of the 50-Prompt Ecosystem</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            <!-- Analytics Overview -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
                <h2 class="text-xl font-bold mb-6 text-gray-800">Framework Overview</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-indigo-50 p-4 rounded-xl text-center">
                        <span id="total-prompts" class="block text-4xl font-black text-indigo-600">--</span>
                        <span class="text-sm font-semibold text-indigo-900 uppercase tracking-wide mt-1 block">Total Prompts</span>
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-xl text-center">
                        <span id="total-categories" class="block text-4xl font-black text-emerald-600">--</span>
                        <span class="text-sm font-semibold text-emerald-900 uppercase tracking-wide mt-1 block">Categories</span>
                    </div>
                    <div class="bg-amber-50 p-4 rounded-xl text-center col-span-2">
                        <span id="total-variables" class="block text-4xl font-black text-amber-600">--</span>
                        <span class="text-sm font-semibold text-amber-900 uppercase tracking-wide mt-1 block">Dynamic Variables Identified</span>
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Distribution by Domain</h2>
                <div class="relative h-64 w-full">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <div class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div id="category-filters" class="flex flex-wrap gap-2">
                <!-- Filters generated by JS -->
            </div>
            <div class="relative w-full md:w-72">
                <input type="text" id="search-input" placeholder="Search prompts..." class="w-full pl-4 pr-10 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
            </div>
        </div>

        <div id="prompts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards generated by JS -->
        </div>
    </div>

    <script>
        let allPrompts = [];
        let chartInstance = null;

        // Colors for categories
        const colors = ['#4f46e5', '#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];

        async function init() {
            try {
                const res = await fetch('/api/prompts');
                allPrompts = await res.json();

                updateAnalytics(allPrompts);
                renderChart(allPrompts);
                renderFilters(allPrompts);
                renderPrompts(allPrompts);

                document.getElementById('search-input').addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = allPrompts.filter(p =>
                        p.title.toLowerCase().includes(term) ||
                        p.description.toLowerCase().includes(term) ||
                        p.category.toLowerCase().includes(term)
                    );
                    renderPrompts(filtered);
                });

            } catch (err) {
                document.getElementById('prompts-grid').innerHTML =
                    `<div class="col-span-full text-center text-red-500 p-10">Failed to load prompt data. Ensure the Next.js server is running and /api/prompts is accessible.</div>`;
            }
        }

        function updateAnalytics(prompts) {
            document.getElementById('total-prompts').textContent = prompts.length;

            const categories = new Set(prompts.map(p => p.category));
            document.getElementById('total-categories').textContent = categories.size;

            const vars = prompts.reduce((sum, p) => sum + (p.variables ? p.variables.length : 0), 0);
            document.getElementById('total-variables').textContent = vars;
        }

        function renderChart(prompts) {
            const ctx = document.getElementById('categoryChart').getContext('2d');

            const categoryCounts = {};
            prompts.forEach(p => {
                const shortName = p.category.split(':')[0];
                categoryCounts[shortName] = (categoryCounts[shortName] || 0) + 1;
            });

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categoryCounts),
                    datasets: [{
                        data: Object.values(categoryCounts),
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        }

        function renderFilters(prompts) {
            const container = document.getElementById('category-filters');
            const categories = ['All', ...new Set(prompts.map(p => p.category))];

            container.innerHTML = categories.map((c, i) => {
                const shortName = c === 'All' ? 'All Domains' : c.split(':')[0];
                return `<button onclick="filterByCategory('${c}')" class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors bg-white border border-gray-200 text-gray-700 hover:bg-gray-100">${shortName}</button>`;
            }).join('');
        }

        window.filterByCategory = function(category) {
            const filtered = category === 'All' ? allPrompts : allPrompts.filter(p => p.category === category);
            renderPrompts(filtered);
        };

        function renderPrompts(prompts) {
            const container = document.getElementById('prompts-grid');

            if (prompts.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500">No prompts found matching your criteria.</div>`;
                return;
            }

            container.innerHTML = prompts.map(p => {
                const shortCategory = p.category.split(':')[0];
                const varsHtml = p.variables && p.variables.length > 0
                    ? p.variables.slice(0, 3).map(v => `<span class="inline-block px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs truncate max-w-[120px]" title="${v}">${v}</span>`).join('') + (p.variables.length > 3 ? `<span class="inline-block px-2 py-1 bg-gray-100 text-gray-500 rounded text-xs">+${p.variables.length - 3}</span>` : '')
                    : '<span class="text-xs text-gray-400 italic">No variables</span>';

                return `
                <div class="prompt-card bg-white rounded-2xl border border-gray-200 overflow-hidden flex flex-col h-full cursor-pointer" onclick="alert('Viewing prompt details is not implemented in this static demo.\\n\\nPrompt: ' + '${p.title}')">
                    <div class="p-5 border-b border-gray-50 bg-gradient-to-r from-gray-50 to-white">
                        <div class="flex justify-between items-start mb-3">
                            <span class="inline-flex items-center justify-center px-2.5 py-1 bg-indigo-100 text-indigo-800 text-xs font-bold rounded-lg shadow-sm">
                                #${p.number}
                            </span>
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider" title="${p.category}">
                                ${shortCategory}
                            </span>
                        </div>
                        <h3 class="font-extrabold text-xl text-gray-900 leading-tight mb-2">${p.title}</h3>
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <p class="text-gray-600 text-sm mb-6 line-clamp-3">${p.description}</p>
                        <div>
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex justify-between items-center">
                                Dynamic Variables
                                <span class="bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded text-[10px]">${p.variables ? p.variables.length : 0}</span>
                            </h4>
                            <div class="flex flex-wrap gap-1.5">
                                ${varsHtml}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
