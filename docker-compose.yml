version: '3.8'

services:
  sigma-seo:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigma-seo:latest
    container_name: sigma-seo-autonomous
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
