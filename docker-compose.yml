# Next.js 16 + MongoDB Local Dev Orchestration
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MACBOOK_CLOUD_SIMULATION=${MACBOOK_CLOUD_SIMULATION:-true}
      - MONGODB_URI=mongodb://mongodb:27017/my-app
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - BOUNDARY_URL=${BOUNDARY_URL:-https://e15e881b-2d8b-49da-9306-e8aaf84eef37.boundary.hashicorp.cloud}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
