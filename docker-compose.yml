# Next.js 16 + MongoDB Local Dev Orchestration
# Phase 13: Sentient Orchestration and APAC Edge Node Simulation
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MACBOOK_CLOUD_SIMULATION=${MACBOOK_CLOUD_SIMULATION:-false}
      - MONGODB_URI=mongodb://mongodb:27017/my-app
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - BOUNDARY_URL=${BOUNDARY_URL:-https://e15e881b-2d8b-49da-9306-e8aaf84eef37.boundary.hashicorp.cloud}
    depends_on:
      - mongodb

  mongodb:
    image: public.ecr.aws/docker/library/mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Autonomous presence container
  connect:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MACBOOK_CLOUD_SIMULATION=${MACBOOK_CLOUD_SIMULATION:-false}
      - MONGODB_URI=mongodb://mongodb:27017/my-app
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    command: ["npm", "run", "connect"]
    depends_on:
      - mongodb
      - app

volumes:
  mongodb_data:
