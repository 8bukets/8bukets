[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markposition-agent-system"
version = "1.0.0"
description = "Autonomous scraping and intelligence ecosystem for markposition.wordpress.com"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jules", email = "jules@example.com" }]
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "textblob",
    "sqlalchemy",
    "rich",
    "python-dotenv",
    "playwright"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
