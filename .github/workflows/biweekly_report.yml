name: Bi-weekly Analytics Report

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Schedule (Bi-weekly)
        id: check_week
        run: |
          # Get ISO week number
          WEEK=$(date +%V)
          echo "Current week number: $WEEK"

          # Run only on even weeks (creates a bi-weekly cadence)
          if (( 10#$WEEK % 2 != 0 )); then
            echo "Odd week detected. Skipping report generation."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "Even week detected. Proceeding with report."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_week.outputs.should_run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check_week.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        if: steps.check_week.outputs.should_run == 'true'
        run: |
          python scraper.py

      - name: Generate Analytics Report
        if: steps.check_week.outputs.should_run == 'true'
        run: |
          python analytics.py

      - name: Commit Report
        if: steps.check_week.outputs.should_run == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add REPORT.md links.json links.csv

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to report."
          else
            git commit -m "chore: update bi-weekly analytics report [skip ci]"
            git push
          fi
