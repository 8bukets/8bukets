name: Bi-Weekly Report

on:
  schedule:
    # Run at 08:00 on the 1st and 15th of every month
    - cron: '0 8 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4

      - name: Run Scraper
        run: python3 scraper.py

      - name: Generate Analytics Report
        run: python3 analytics.py

      - name: Commit and Push Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.json links.csv unique_links.txt REPORT.md
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update bi-weekly analytics report [skip ci]"
            git push
          fi
