name: Bi-Weekly Report

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if week is odd
        id: check_week
        run: |
          # Get current week number
          WEEK=$(date +%V)
          # Check if week number is odd
          if [ $((WEEK % 2)) -ne 0 ]; then
            echo "Odd week ($WEEK). Skipping execution to run bi-weekly (on even weeks)."
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "Even week ($WEEK). Proceeding with report."
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_week.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check_week.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4 requests

      - name: Run Scraper
        if: steps.check_week.outputs.run == 'true'
        run: |
          python scraper.py --json links.json --csv links.csv --txt unique_links.txt

      - name: Run Analytics
        if: steps.check_week.outputs.run == 'true'
        run: |
          python analytics.py --input links.json --output REPORT.md

      - name: Commit and Push Report
        if: steps.check_week.outputs.run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.json links.csv unique_links.txt REPORT.md
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📊 Bi-weekly analytics report [skip ci]"
            git push
          fi
