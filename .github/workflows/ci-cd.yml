name: CI/CD Pipeline with GCP

on:
  push:
    branches:
      - jules/scraper-markposition-17752547678215960211
  pull_request:

jobs:
  test:
    name: Test and Lint Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, scraper]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up Node.js
      if: matrix.service == 'backend'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend/Backend Dependencies
      if: matrix.service == 'backend'
      run: npm install

    - name: Run Backend Tests
      if: matrix.service == 'backend'
      run: npm test

    - name: Set Up Python
      if: matrix.service == 'scraper'
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install Scraper Dependencies
      if: matrix.service == 'scraper'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Tests
      if: matrix.service == 'scraper'
      run: pytest

