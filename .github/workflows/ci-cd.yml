name: CI/CD Pipeline

on:
  push:
    branches:
      - jules/scraper-markposition-17752547678215960211
  pull_request:

jobs:
  test:
    name: Test and Lint Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, scraper]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up Node.js
      if: matrix.service == 'backend'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend/Backend Dependencies
      if: matrix.service == 'backend'
      run: npm install

    - name: Run Backend Tests
      if: matrix.service == 'backend'
      run: npm test

    - name: Set Up Python
      if: matrix.service == 'scraper'
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install Scraper Dependencies
      if: matrix.service == 'scraper'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Tests
      if: matrix.service == 'scraper'
      run: pytest

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repository name to lowercase
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Build and Push Backend Image (GHCR)
      run: |
        docker build -t ghcr.io/${{ env.REPO_LC }}/backend:latest ./backend || echo "No backend folder found"
        docker push ghcr.io/${{ env.REPO_LC }}/backend:latest || echo "Skipping backend push"

    - name: Build and Push Frontend Image (GHCR)
      run: |
        docker build -t ghcr.io/${{ env.REPO_LC }}/frontend:latest ./frontend || echo "No frontend folder found"
        docker push ghcr.io/${{ env.REPO_LC }}/frontend:latest || echo "Skipping frontend push"

    - name: Build and Push Scraper Image (GHCR)
      run: |
        docker build -t ghcr.io/${{ env.REPO_LC }}/scraper:latest .
        docker push ghcr.io/${{ env.REPO_LC }}/scraper:latest

