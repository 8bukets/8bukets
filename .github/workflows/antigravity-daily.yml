name: Antigravity Autonomous Daily Work

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  autonomous-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Autonomous Work Cycle
        run: npx tsx -e "import { jules } from './antigravity/jules'; jules.executeWorkCycle()"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Push Changes
        run: |
          git config --global user.name "filip keser"
          git config --global user.email "8bukets@gmail.com"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
