name: Antigravity Autonomous Daily Work

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  autonomous-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Autonomous Work Cycle
        run: npx tsx -e "import { jules } from './antigravity/jules'; jules.executeWorkCycle()"
        env:
          MACBOOK_CLOUD_SIMULATION: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Push Changes
        run: |
          npm run build || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: autonomous daily work update" || true
          git pull --rebase origin main || true
          git push origin main || true
        env:
          MACBOOK_CLOUD_SIMULATION: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
