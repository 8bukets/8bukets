name: Continuous Autonomous Presence

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autonomous-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ignite Continuous Autonomous Cycle
        run: npm run ignite
        env:
          MACBOOK_CLOUD_SIMULATION: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Persist Autonomous State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: persist continuous autonomous presence state" || true
          git pull --rebase origin main || true
          git push origin main || true
        env:
          MACBOOK_CLOUD_SIMULATION: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
