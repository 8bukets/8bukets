name: Test autonomous_documentation

on:
  push:
    paths:
      - 'antigravity/services/autonomous_documentation.ts'
      - 'antigravity/services/autonomous_documentation.test.ts'
  pull_request:
    paths:
      - 'antigravity/services/autonomous_documentation.ts'
      - 'antigravity/services/autonomous_documentation.test.ts'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npx vitest run antigravity/services/autonomous_documentation.test.ts
