name: Autonomous Marketing1usa Knowledge Ingestion

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 4 AM
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install requests beautifulsoup4
      - name: Run Marketing1usa Ingestion
        run: npm run ingest:marketing1usa
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "🤖 auto: market intelligence update (marketing1usa)" || echo "No changes to commit"
          git push
