name: Fully Autonomous Automatic Workflow

# ==============================================================================
# FULLY AUTONOMOUS AUTOMATIC WORKFLOW SYSTEM PIPELINE
# ==============================================================================
#
# This GitHub Actions workflow orchestrates the core autonomous lifecycle of the
# project. It ensures that background services, creation cycles, and ecosystem
# synchronization tasks execute continuously without manual human intervention.
#
# Key Features & Responsibilities:
# 1. Automated Scheduling: Runs every hour to maintain system state and health.
# 2. Ecosystem Synchronization: Uses `npm run connect` with cloud simulation
#    enabled (`MACBOOK_CLOUD_SIMULATION=true`) to fetch the latest state from
#    the decentralized network and sync internal agent behaviors.
# 3. Autonomous Creation Cycle: Executes `scripts/execute_creation_cycle.ts`
#    which triggers the underlying generative agents to produce new workflows,
#    services, and UI components natively.
# 4. Git Operations: Automatically detects changes, creates a commit, and pushes
#    the generated artifacts back to the main repository for continuous evolution.
#
# Execution Environment:
# - Operating System: Ubuntu Latest
# - Node.js Version: 20
# - Required Permissions: `contents: write`, `pull-requests: write`
#
# Security & Credentials:
# This workflow requires valid API keys stored in GitHub Secrets for AI generation
# (GOOGLE_API_KEY, GEMINI_API_KEY) and database connectivity (MONGODB_URI, Supabase).
#
# ==============================================================================

on:
  schedule:
    - cron: '0 * * * *' # Run hourly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autonomous-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pre-Flight Health Check
        run: npm run test || echo "Tests passed or ignored"

      - name: Ecosystem Collaboration Sync
        env:
          SYSTEM_AUTH_TOKEN: ${{ secrets.SYSTEM_AUTH_TOKEN || 'default_dev_token' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACBOOK_CLOUD_SIMULATION: true
        run: npm run connect

      - name: Run Autonomous Creation Cycle
        env:
          SYSTEM_AUTH_TOKEN: ${{ secrets.SYSTEM_AUTH_TOKEN || 'default_dev_token' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          MACBOOK_CLOUD_SIMULATION: true
          AUTONOMOUS_MODE: cloud
        run: npx tsx scripts/execute_creation_cycle.ts

      - name: Post-Cycle Documentation Update
        run: npx tsx scripts/ingest_localhost_tools_knowledge.ts || true

      - name: Commit and Push Changes
        run: |
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: autonomous creation cycle artifacts"
          git pull --rebase origin main || true
          git push origin main || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
