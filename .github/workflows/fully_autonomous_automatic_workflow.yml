name: Fully Autonomous Automatic Workflow

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fully-autonomous:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Connect and Collaborate
        run: npm run connect
        env:
          MACBOOK_CLOUD_SIMULATION: true

      - name: Execute Fully Autonomous Creation Cycle
        run: npx tsx scripts/execute_creation_cycle.ts
        env:
          AUTONOMOUS_MODE: cloud
          MACBOOK_CLOUD_SIMULATION: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------
# Fully Autonomous Automatic Workflow Configuration
# ---------------------------------------------------------
# This workflow is responsible for the fully autonomous
# automatic creation cycle. It ensures the system can operate
# independently without human intervention.
#
# Key Features:
# 1. Scheduled Execution: Runs daily at midnight UTC.
# 2. Manual Dispatch: Can be triggered manually if needed.
# 3. Cloud Simulation: Utilizes MACBOOK_CLOUD_SIMULATION to
#    simulate a cloud environment for local ecosystem syncs.
# 4. Dependency Management: Ensures all required npm packages
#    are installed and cached for faster execution.
# 5. Ecosystem Collaboration: Connects with the broader network
#    before executing the core creation cycle.
# 6. Autonomous Creation: Triggers scripts/execute_creation_cycle.ts
#    with necessary environment variables and secrets.
#
# Environment Variables:
# - AUTONOMOUS_MODE: Set to 'cloud' for autonomous operation.
# - MACBOOK_CLOUD_SIMULATION: Essential for triggering the
#   ecosystem collaboration syncs.
# - MONGODB_URI: Required for database connectivity.
# - NEXT_PUBLIC_SUPABASE_URL: Required for Supabase integration.
# - NEXT_PUBLIC_SUPABASE_ANON_KEY: Required for Supabase auth.
# - GITHUB_TOKEN: Necessary for interacting with the GitHub API.
