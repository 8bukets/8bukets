name: Daily Knowledge & License Check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate License
        run: npm run validate:license

      - name: Ingest Knowledge
        run: npm run ingest:knowledge || true
        env:
          MACBOOK_CLOUD_SIMULATION: true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add KNOWLEDGE_MERGE.md CONSOLIDATED_INTELLIGENCE.md || true
          git commit -m "chore: auto-ingest multi-day agent knowledge and validate license" || true
          git push origin HEAD:${{ github.ref }}
