name: Autonomous Daily Cycle

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  run-autonomous-system:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Ensure compatibility with aiohttp

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        PYTHONPATH=. python3 -m pytest tests/

    - name: Run Autonomous Cycle
      env:
        SYSTEM_AUTH_TOKEN: ${{ secrets.SYSTEM_AUTH_TOKEN || 'default_dev_token' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # We skip the scraper here to prevent IP bans from GitHub Actions
        python3 run_system.py --skip-scraper
