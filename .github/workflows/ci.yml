name: ci

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [scraper, frontend, sr-backend, sr-frontend]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Scraper Tests (Python)
    - name: Set Up Python
      if: matrix.service == 'scraper'
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install Scraper Dependencies
      if: matrix.service == 'scraper'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Tests
      if: matrix.service == 'scraper'
      run: pytest

    # Root Frontend Tests (Node)
    - name: Set Up Node.js
      if: matrix.service == 'frontend'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      if: matrix.service == 'frontend'
      run: |
        cd frontend
        npm install

    - name: Run Frontend Lint
      if: matrix.service == 'frontend'
      run: |
        cd frontend
        npm run lint

    # Software Review Backend Tests
    - name: Set Up Node.js
      if: matrix.service == 'sr-backend'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install SR Backend Dependencies
      if: matrix.service == 'sr-backend'
      run: |
        cd software-review-platform/backend
        npm install

    - name: Run SR Backend Tests
      if: matrix.service == 'sr-backend'
      run: |
        cd software-review-platform/backend
        npm test

    # Software Review Frontend Tests
    - name: Set Up Node.js
      if: matrix.service == 'sr-frontend'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install SR Frontend Dependencies
      if: matrix.service == 'sr-frontend'
      run: |
        cd software-review-platform/frontend
        npm install

    - name: Run SR Frontend Check
      if: matrix.service == 'sr-frontend'
      run: |
        cd software-review-platform/frontend
        npm run check

  market-analysis:
    name: Market Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci --cache .npm --prefer-offline || npm install
      - name: Run Market Analysis
        run: |
          npm run ingest:sor
          npm run ingest:forbes

  docker:
    name: Build and Push
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: "sor"
            context: "."
            dockerfile: "Dockerfile"
          - service: "frontend"
            context: "frontend"
            dockerfile: "frontend/Dockerfile"
          - service: "sr-backend"
            context: "software-review-platform/backend"
            dockerfile: "software-review-platform/backend/Dockerfile"
          - service: "sr-frontend"
            context: "software-review-platform/frontend"
            dockerfile: "software-review-platform/frontend/Dockerfile"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: secrets.DOCKER_ACCESS_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_ACCOUNT || 'getanant' }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ (secrets.DOCKER_ACCESS_TOKEN != '' && vars.CLOUD_BUILDER_NAME != '') && 'cloud' || 'docker-container' }}
          endpoint: ${{ (secrets.DOCKER_ACCESS_TOKEN != '' && vars.CLOUD_BUILDER_NAME != '') && format('{0}/{1}', vars.DOCKER_ACCOUNT || 'getanant', vars.CLOUD_BUILDER_NAME) || '' }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: "${{ vars.DOCKER_ACCOUNT || 'getanant' }}/${{ matrix.service }}:latest"
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=registry' || 'type=cacheonly' }}
