name: Creative Workflow

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  analyze-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Analyze Market
        run: |
          npm run ingest:sor
          npm run ingest:forbes

  daily-tasks:
    runs-on: ubuntu-latest
    needs: analyze-market
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Daily Tasks
        run: npm run daily

  autonomous-evolution:
    runs-on: ubuntu-latest
    needs: daily-tasks
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Autonomous Evolution
        run: npx tsx scripts/execute_creation_cycle.ts
