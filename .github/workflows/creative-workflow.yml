name: Antigravity Creative Workflow

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  market-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Market Analysis
        run: |
          npm run ingest:sor
          npm run ingest:forbes

  daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Daily Tasks
        run: npm run daily
        env:
          MACBOOK_CLOUD_SIMULATION: true

  autonomous-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Autonomous Evolution
        run: npx tsx scripts/execute_creation_cycle.ts
        env:
          MACBOOK_CLOUD_SIMULATION: true
