name: Creative Workflow Pipeline

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  creative-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Market Analysis
        run: npm run ingest:sor
        env:
          MACBOOK_CLOUD_SIMULATION: true

      - name: Daily Tasks
        run: npm run daily
        env:
          MACBOOK_CLOUD_SIMULATION: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Autonomous Evolution
        run: npx tsx scripts/execute_creation_cycle.ts
        env:
          MACBOOK_CLOUD_SIMULATION: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
