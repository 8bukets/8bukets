[build]
  publish = "."
  command = "echo 'Build not required'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[redirects]]
  from = "/report/*"
  to = "/results/:splat"
  status = 200

[[redirects]]
  from = "/evolution"
  to = "/SYSTEM_EVOLUTION.md"
  status = 200
