stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: getanant/sor
  TAG: latest

build-docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache make bash
  script:
    - make docker-build
    - if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then make docker-push; else echo "Skipping push, DOCKER_USERNAME or DOCKER_PASSWORD not set"; fi

test-job:
  stage: test
  script:
    - echo "This job tests something"

deploy-prod:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
  environment: production
