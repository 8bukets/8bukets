build-job:
  stage: build
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"

test-job1:
  stage: test
  script:
    - echo "This job tests something"

test-job2:
  stage: test
  script:
    - echo "This job tests something, but takes more time than test-job1."
    - echo "After the echo commands complete, it runs the sleep command for 20 seconds"
    - echo "which simulates a test that runs 20 seconds longer than test-job1"
    - sleep 20

deploy-prod:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
  environment: production

run-autonomous-test_cli:
  stage: test
  script:
    - echo "Running autonomous cycle for Test CLI Service"
    - npx tsx antigravity/workflows/test_cli_workflow.ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

run-autonomous-test_reverted_command_format:
  stage: test
  script:
    - echo "Running autonomous cycle for Test Reverted Command format"
    - npx tsx antigravity/workflows/test_reverted_command_format_workflow.ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

run-autonomous-implement_horizontal_fleet_orchestration_service_manages_dynamic_horizontal_scaling_and_localized_routing_logic_for_edge_container_deployments_:
  stage: test
  script:
    - echo "Running autonomous cycle for Implement Horizontal Fleet Orchestration Service: Manages dynamic horizontal scaling and localized routing logic for edge container deployments."
    - npx tsx antigravity/workflows/implement_horizontal_fleet_orchestration_service_manages_dynamic_horizontal_scaling_and_localized_routing_logic_for_edge_container_deployments__workflow.ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
