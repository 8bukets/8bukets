stages:
  - autonomous
  - build
  - test
  - deploy

autonomous-work-cycle:
  stage: autonomous
  image: node:20
  only:
    - schedules
    - web
  script:
    - npm ci
    - npx tsx antigravity/run_parallel.ts
  variables:
    MONGODB_URI: $MONGODB_URI
    NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
    NEXT_PUBLIC_SUPABASE_ANON_KEY: $NEXT_PUBLIC_SUPABASE_ANON_KEY
    GITLAB_TOKEN: $GITLAB_TOKEN

build-job:
  stage: build
  image: node:20
  script:
    - npm ci
    - npm run build

test-job:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm test
