services:
- type: web
  name: frontend
  env: node
  region: ohio
  rootDir: frontend
  buildCommand: npm install && npm run build
  startCommand: npm start
  envVars:
  - key: NODE_ENV
    value: production
  - key: MONGODB_URI
    sync: false
  - key: SUPABASE_DATABASE_URL
    sync: false
  - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
    sync: false
  - key: MACBOOK_CLOUD_SIMULATION
    value: 'true'
- type: worker
  name: autonomous-system
  env: docker
  region: ohio
  dockerCommand: python run_system.py --loop
  envVars:
  - key: MONGODB_URI
    sync: false
  - key: SUPABASE_DATABASE_URL
    sync: false
  - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
    sync: false
  - key: SYSTEM_AUTH_TOKEN
    sync: false
  - key: GOOGLE_API_KEY
    sync: false
  - key: GEMINI_API_KEY
    sync: false
  - key: MACBOOK_CLOUD_SIMULATION
    value: 'true'
